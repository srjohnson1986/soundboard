name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless; cancel it. Runs on
# master are never cancelled, so every merge gets a full result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes skip the build: nothing in a Markdown file can break it.
  # This is a job-level skip rather than a workflow-level paths-ignore on purpose:
  # build-and-test is a required check on master, and a workflow that never runs never
  # reports its check, leaving the PR stuck on "pending". A job skipped by `if:` still
  # reports ("skipped"), which counts as passing (#183).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything besides docs change?
        id: filter
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push) range="${{ github.event.before }}..${{ github.sha }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;  # manual runs always build
          esac
          changed="$(git diff --name-only "$range")"
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The jobs below run side by side, each on its own runner; build-and-test waits for all
  # of them. Gradle's parallel mode, build cache and configuration cache are on in
  # gradle.properties, and setup-gradle keeps the build cache between runs (written by runs
  # on master, read by pull requests), so unchanged modules aren't rebuilt.
  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # One Gradle run, so tasks run in parallel; --continue reports every failure, not just the first.
      - name: Lint, unit tests and debug APK
        run: ./gradlew lintDebug :shared:lintAndroidMain testDebugUnitTest assembleDebug --continue --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            shared/build/reports/lint-results-androidMain.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # The shared module's tests, on the JVM and compiled to WebAssembly (run in the runner's
  # headless Chrome), and the web app's own tests: this is what keeps shared code building
  # for the web version as well as Android (#193).
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The browser tests bundle the app with webpack, which needs the npm packages Gradle installs
      # under build/wasm/node_modules (@js-joda/core from kotlinx-datetime, fflate for zips).
      # On some runs the install reported success but the packages weren't there (#347): webpack
      # then failed with "Can't resolve '@js-joda/core'" and headless Chrome sat silent for ten
      # minutes before Karma gave up. So the install is its own step, checked, and repeated from
      # scratch if the packages are missing, which fails in seconds and says why.
      - name: Install the npm packages the browser tests need
        run: |
          for attempt in 1 2 3; do
            ./gradlew kotlinWasmNpmInstall --stacktrace
            if [ -f build/wasm/node_modules/@js-joda/core/package.json ] && [ -f build/wasm/node_modules/fflate/package.json ]; then
              exit 0
            fi
            echo "::warning::kotlinWasmNpmInstall left build/wasm/node_modules without @js-joda/core or fflate (attempt $attempt of 3)"
            rm -rf build/wasm/node_modules
          done
          echo "::error::The npm packages are still missing after 3 installs (#347)"
          exit 1

      - name: Shared and web app tests (JVM + Wasm)
        run: ./gradlew :shared:allTests :web:allTests --continue --stacktrace

      # If the packages go missing anyway, this shows what the install left (#347).
      - name: Record what the npm install left behind
        if: failure()
        run: |
          {
            echo "== build/wasm"; ls -la build/wasm || true
            echo "== node_modules (top level, count)"; ls build/wasm/node_modules 2>/dev/null | wc -l
            echo "== @js-joda and fflate"; ls -la build/wasm/node_modules/@js-joda build/wasm/node_modules/fflate 2>&1 || true
            echo "== packages"; ls -la build/wasm/packages || true
            echo "== disk"; df -h . || true
          } > build/wasm-npm-diagnostics.txt 2>&1 || true
          cat build/wasm-npm-diagnostics.txt

      - name: Upload the npm diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-npm-diagnostics
          path: |
            build/wasm-npm-diagnostics.txt
            build/wasm/package.json
            build/wasm/yarn.lock
            build/wasm/packages/*/package.json
            build/wasm/node_modules/.yarn-integrity
          if-no-files-found: ignore

      # The production bundle takes a while to optimize, and the tests above already build the
      # web app, so it's only built on master, where it's kept as an artifact. Releases build
      # their own (web.yml).
      - name: Build web app
        if: github.event_name != 'pull_request'
        run: ./gradlew :web:wasmJsBrowserDistribution --stacktrace

      # Serves the bundle from /soundboard/ as GitHub Pages does and checks it in headless
      # Chrome, online and offline (#223; web/smoke/smoke.mjs).
      - name: Smoke-test the web app
        if: github.event_name != 'pull_request'
        working-directory: web/smoke
        run: |
          npm ci --no-audit --no-fund
          node smoke.mjs

      - name: Upload web app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: web/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

      # A screenshot test that failed leaves the new image and a comparison next to it (#221).
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-differences
          path: shared/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Upload shared test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-report
          path: |
            shared/build/reports/tests/allTests
            web/build/reports/tests/allTests
          if-no-files-found: ignore

  # Test coverage of the JVM tests (the app's and shared's), with a floor for the core (#222):
  # the data and model packages and BoardViewModel each keep at least 90% of their lines
  # covered. See build.gradle.kts (kover, verifyCoreCoverage). It runs beside the other two, since
  # measuring means running the tests again with Kover's agent.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Coverage report and floor
        run: ./gradlew :koverHtmlReportUnit :verifyCoreCoverage --continue --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/htmlUnit
          if-no-files-found: ignore

  # The docs' links, anchors, and the paths and Gradle projects they name all exist
  # (scripts/check-docs.py, #274). A few seconds, and it runs on every change, docs-only
  # ones included: a renamed file or heading fails here instead of leaving a doc stale.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the docs
        run: python3 scripts/check-docs.py

      # The Spanish phrasebook is made from presets/*.zip (#342): a preset that changed without it fails here.
      - name: Check the Spanish phrasebook is current
        run: python3 scripts/build-phrasebook.py --check

  # The required check. It passes when the docs check passed and the three build jobs did
  # too, or were skipped because only docs changed; it runs even then (always()), so the
  # check always reports (#183).
  build-and-test:
    needs: [changes, docs, android, web, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The docs check passed, and all three build jobs did, or only docs changed
        run: |
          echo "changes: ${{ needs.changes.result }}, code: ${{ needs.changes.outputs.code }}, docs: ${{ needs.docs.result }}"
          echo "android: ${{ needs.android.result }}, web: ${{ needs.web.result }}, coverage: ${{ needs.coverage.result }}"
          if [ "${{ needs.changes.result }}" != "success" ] || [ "${{ needs.docs.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then exit 0; fi
          [ "${{ needs.android.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ] && [ "${{ needs.coverage.result }}" = "success" ]
