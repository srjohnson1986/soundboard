android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m
# Faster builds, locally and in CI: independent tasks run at once, task outputs are reused
# from earlier builds, and the build configuration is reused when nothing in it changed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The shared module's iOS targets only build on macOS (#265); elsewhere they're skipped quietly
# rather than with a warning on every build.
kotlin.native.ignoreDisabledTargets=true

# The app version, for both the Android build and the shared UI (see docs/RELEASING.md).
appVersionName=1.0.0
appVersionCode=6

# Screenshot tests (#221) compare against shared/screenshots on every test run; record new
# ones with ./gradlew :shared:recordRoborazziAndroidHostTest.
roborazzi.test.verify=true
