name: Bug report
description: Something doesn't work, or the board went quiet without saying why
labels: [bug]
body:
  - type: checkboxes
    id: platform
    attributes:
      label: Where did you see it?
      description: Tick every platform where it happens. If you only tried one, tick that one.
      options:
        - label: Android app
        - label: Web version
        - label: iOS app
  - type: input
    id: version
    attributes:
      label: Version
      description: The app version if you know it (or the release you installed), or the web version's browser.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the board\n2. Tap ...\n3. ..."
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot, the device and Android version, or whether the data was lost. Please don't attach a backup that contains someone's private recordings.
