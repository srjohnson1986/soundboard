version: 2

# Dependency updates (#289): Dependabot opens them, dependabot-auto-merge.yml queues the
# merge, and the required build-and-test check decides whether it lands. A bump that goes
# red is left for the weekly Claude routine to repair (docs/ARCHITECTURE.md, "Testing").
#
# A dependency joins the FIRST group whose patterns match it, so the order below matters.
# Versions that only work together are grouped so they move in one pull request; anything
# no group matches (Kover, JUnit, Robolectric) gets a pull request of its own.
#
# A change to this file starts a Dependabot run at once; that is how a run is forced
# between Mondays (2026-10-01: after Kover 0.9.10's cooldown ended).
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    # Wait 3 days after a release before proposing it: nothing here is reviewed by a person.
    # AndroidX is exempt (#293, #295): Google Maven dates only an artifact's newest release,
    # and Dependabot drops every version it can't date, so activity-compose 1.13.0 (a newer
    # alpha exists) was never proposed. Without a cooldown block Dependabot applies its own
    # 3-day default, so this has to be explicit.
    cooldown:
      default-days: 3
      exclude:
        - "androidx.*"
    open-pull-requests-limit: 10
    groups:
      # Kotlin, Compose Multiplatform, JetBrains' AndroidX forks (lifecycle) and the
      # Compose artifacts that track the same version (BOM, ui-test-manifest).
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
          - "androidx.compose*"
      # kotlinx-coroutines and kotlinx-serialization (not the Kover plugin, whose id has
      # no colon).
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
      # The Android Gradle plugin needs a minimum Gradle, so they move together.
      android-build:
        patterns:
          - "com.android.*"
          - "gradle-wrapper"
      androidx:
        patterns:
          - "androidx.*"
      # The plugin and its two libraries share one version.
      roborazzi:
        patterns:
          - "io.github.takahirom.roborazzi*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    # Wait a few days after a release before proposing it: a bad release is usually
    # pulled or patched within that time, and nothing here is reviewed by a person.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
