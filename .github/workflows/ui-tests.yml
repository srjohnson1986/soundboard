name: UI tests

# The instrumented Compose UI tests (androidTest/) on an emulator. Advisory rather than a
# merge gate: emulators on shared runners occasionally flake on timing-sensitive gestures,
# so a red run here is a prompt to look, not a blocker. Run it by hand ("Run workflow")
# before a release.

# Documentation-only changes skip the emulator run (see the matching note in ci.yml).
# It also runs on master after each merge and twice a week: that's what fills and keeps
# alive the emulator snapshot cache pull requests read (GitHub keeps each branch's caches to
# itself, apart from master's, and deletes one nobody has read for 7 days). Only master
# saves that snapshot (it's 2.4 GB, and the repository's cache limit is 10 GB, so a copy
# per pull request fills it); a pull request restores it, or on a miss builds its own for
# that run and throws it away.
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']
  # Monday and Thursday at 06:00 UTC: Monday's is before Dependabot's 05:00 Eastern run
  # (09:00 or 10:00 UTC), whose pull requests read the snapshot; Thursday's keeps the gap
  # between two reads well under the 7 days a cache survives unread (one run a week would
  # have to land within minutes of the same time each week). Scheduled runs only ever
  # happen on the default branch, and paths-ignore doesn't apply to them.
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request run cancels the older one, but a run on master is never cancelled
# by the next merge: it may be the one that saves the snapshot cache.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  API_LEVEL: 35
  TARGET: google_apis
  ARCH: x86_64
  PROFILE: pixel_6

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true  # only ci.yml's web job saves Gradle's caches (see there, #356)

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Hardware acceleration for the emulator; without it an x86_64 image is far too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before the emulator boots, so its boot time isn't spent waiting on Gradle.
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Everyone restores; only master saves (below), so there is one snapshot, on master,
      # which every pull request can read.
      - name: Restore AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}

      - name: Create AVD snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Saved here rather than at the end of the job, so a failing test run still leaves it.
      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Run UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
