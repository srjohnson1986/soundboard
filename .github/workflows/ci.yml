name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly on master, Monday 13:00 UTC: three hours after Dependabot's 05:00 Eastern run
  # (09:00 UTC in summer, 10:00 in winter) has had time to open its pull requests and have them
  # merged. Dependabot's merges start no push run (see below), so this is the first full run
  # on master with the new versions, and it's the `web` job's chance to refresh Gradle's
  # caches. A scheduled run that fails opens an issue (report-scheduled-failure, #364).
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless; cancel it. Runs on
# master are never cancelled, so every merge gets a full result. A scheduled run has no pull
# request, so it is grouped by the commit it runs on (like a push) and is never cancelled; if
# a push run is still going on that very commit, the scheduled one waits its turn.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes skip the build: nothing in a Markdown file can break it.
  # This is a job-level skip rather than a workflow-level paths-ignore on purpose:
  # build-and-test is a required check on master, and a workflow that never runs never
  # reports its check, leaving the PR stuck on "pending". A job skipped by `if:` still
  # reports ("skipped"), which counts as passing (#183).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      build_inputs: ${{ steps.filter.outputs.build_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `code`: anything besides docs changed. `build_inputs`: a file that decides which
      # versions the production web bundle is built with changed, so the pull request builds
      # and smoke-tests it too (the `web` job); that covers every Dependabot Gradle bump,
      # whose merge starts no push run on master (#364). Other pull requests skip the bundle.
      - name: Did anything besides docs change?
        id: filter
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push) range="${{ github.event.before }}..${{ github.sha }}" ;;
            # Manual and scheduled runs always build, and always bundle.
            *) printf 'code=true\nbuild_inputs=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed="$(git diff --name-only "$range")"
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '(\.gradle\.kts$|^gradle/|^gradle\.properties$|^kotlin-js-store/|^web/smoke/)'; then
            echo "build_inputs=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_inputs=false" >> "$GITHUB_OUTPUT"
          fi

  # The jobs below run side by side, each on its own runner; build-and-test waits for all
  # of them. Each JVM test runs in exactly one job, so none is paid for twice:
  #   android   lint and the debug APK (no tests),
  #   web       the Wasm tests in headless Chrome, the web app's tests and the iOS compile,
  #   coverage  every JVM test (shared's Android host tests and the app's unit tests), under
  #             Kover, which also gives the coverage report and floor.
  # Gradle's parallel mode, build cache and configuration cache are on in gradle.properties,
  # and setup-gradle keeps Gradle's caches (dependencies, transforms, build cache) between
  # runs, so unchanged modules aren't rebuilt.
  #
  # Only the `web` job writes those caches, and only on master; every other Gradle job here
  # and in ui-tests.yml is read-only (`cache-read-only: true`). setup-gradle saves a whole
  # new set of entries, named by a hash of their content, from every job that writes, so
  # with four writers each merge added four sets of 0.8-1.5 GB each, which stayed for 7
  # idle days and filled the repository's 10 GB (#356). The other jobs restore the most
  # recent entry on the runner OS and find in it only what the writing job ran: Gradle's
  # build cache holds the output of the cacheable tasks the writer executed, and nothing
  # else. So the writer has to run what the others run: on master `web` also compiles and
  # lints the Android side (the "Warm the caches" step). While it ran only the Wasm tests,
  # `android` found nothing of its own in the entry and compiled and linted the app from
  # scratch, 250-300 s instead of about 60 (#369).
  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true  # only the web job saves Gradle's caches (see above)

      - name: Make gradlew executable
        run: chmod +x gradlew

      # One Gradle run, so tasks run in parallel; --continue reports every failure, not just the first.
      # The unit tests run in `coverage`, once, under Kover.
      - name: Lint and debug APK
        run: ./gradlew lintDebug :shared:lintAndroidMain assembleDebug --continue --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            shared/build/reports/lint-results-androidMain.html
          if-no-files-found: ignore

  # The shared module's tests compiled to WebAssembly (run in the runner's headless Chrome)
  # and the web app's own tests: this is what keeps shared code building for the web version
  # as well as Android (#193). It also compiles shared's iOS code and its tests, which
  # Kotlin does on any host (only the link and the run need a Mac), so a compile error in
  # iosMain or iosTest fails here and not only in the iOS workflow. `:shared:allTests` used
  # to do that and run the JVM tests too; now `coverage` runs the JVM ones.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false  # SCRATCH #369

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The browser tests bundle the app with webpack, which needs the npm packages Gradle installs
      # under build/wasm/node_modules (@js-joda/core from kotlinx-datetime, fflate for zips).
      # On some runs the install reported success but the packages weren't there (#347): webpack
      # then failed with "Can't resolve '@js-joda/core'" and headless Chrome sat silent for ten
      # minutes before Karma gave up. So the install is its own step, checked, and repeated from
      # scratch if the packages are missing, which fails in seconds and says why.
      - name: Install the npm packages the browser tests need
        run: |
          for attempt in 1 2 3; do
            ./gradlew kotlinWasmNpmInstall --stacktrace
            if [ -f build/wasm/node_modules/@js-joda/core/package.json ] && [ -f build/wasm/node_modules/fflate/package.json ]; then
              exit 0
            fi
            echo "::warning::kotlinWasmNpmInstall left build/wasm/node_modules without @js-joda/core or fflate (attempt $attempt of 3)"
            rm -rf build/wasm/node_modules
          done
          echo "::error::The npm packages are still missing after 3 installs (#347)"
          exit 1

      - name: Shared and web app tests (Wasm), and the iOS compile
        run: >
          ./gradlew :shared:wasmJsBrowserTest :web:allTests
          :shared:compileKotlinIosSimulatorArm64 :shared:compileTestKotlinIosSimulatorArm64
          --continue --stacktrace

      # The one job that saves Gradle's caches, on master only, so what it saves has to cover
      # the other two jobs as well (see the comment above `android`): compile and lint the
      # Android side, and compile the JVM tests, without running anything.
      - name: Warm the caches for android and coverage
        if: ${{ !cancelled() }}  # SCRATCH #369
        run: >
          ./gradlew lintDebug :shared:lintAndroidMain assembleDebug
          :shared:compileAndroidHostTest :app:compileDebugUnitTestKotlin
          --continue --stacktrace

      # If the packages go missing anyway, this shows what the install left (#347).
      - name: Record what the npm install left behind
        if: failure()
        run: |
          {
            echo "== build/wasm"; ls -la build/wasm || true
            echo "== node_modules (top level, count)"; ls build/wasm/node_modules 2>/dev/null | wc -l
            echo "== @js-joda and fflate"; ls -la build/wasm/node_modules/@js-joda build/wasm/node_modules/fflate 2>&1 || true
            echo "== packages"; ls -la build/wasm/packages || true
            echo "== disk"; df -h . || true
          } > build/wasm-npm-diagnostics.txt 2>&1 || true
          cat build/wasm-npm-diagnostics.txt

      - name: Upload the npm diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-npm-diagnostics
          path: |
            build/wasm-npm-diagnostics.txt
            build/wasm/package.json
            build/wasm/yarn.lock
            build/wasm/packages/*/package.json
            build/wasm/node_modules/.yarn-integrity
          if-no-files-found: ignore

      # The production bundle takes a while to optimize, and the tests above already build the
      # web app, so it's built on master, where it's kept as an artifact, and on pull requests
      # that change a build input (the `changes` job), since a toolchain bump that breaks the
      # bundle must not first show on release day (#364). Releases build their own (web.yml).
      - name: Build web app
        if: github.event_name != 'pull_request' || needs.changes.outputs.build_inputs == 'true'
        run: ./gradlew :web:wasmJsBrowserDistribution --stacktrace

      # Serves the bundle from /soundboard/ as GitHub Pages does and checks it in headless
      # Chrome, online and offline (#223; web/smoke/smoke.mjs).
      - name: Smoke-test the web app
        if: github.event_name != 'pull_request' || needs.changes.outputs.build_inputs == 'true'
        working-directory: web/smoke
        run: |
          npm ci --no-audit --no-fund
          node smoke.mjs

      - name: Upload web app
        if: github.event_name != 'pull_request' || needs.changes.outputs.build_inputs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: web/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

      - name: Upload Wasm test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-report
          path: |
            shared/build/reports/tests/wasmJsBrowserTest
            web/build/reports/tests/wasmJsBrowserTest
          if-no-files-found: ignore

  # The JVM tests (the app's unit tests and shared's Android host tests), run once, under
  # Kover's agent, which also gives the coverage report and a floor for the core (#222): the
  # data and model packages and BoardViewModel each keep at least 90% of their lines covered.
  # See build.gradle.kts (kover, verifyCoreCoverage). A failing test fails this job.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true  # only the web job saves Gradle's caches (see above)

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: JVM tests, coverage report and floor
        run: ./gradlew :koverHtmlReportUnit :verifyCoreCoverage --continue --stacktrace

      # A screenshot test that failed leaves the new image and a comparison next to it (#221).
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-differences
          path: shared/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-report
          path: |
            shared/build/reports/tests/testAndroidHostTest
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/htmlUnit
          if-no-files-found: ignore

  # The docs' links, anchors, and the paths and Gradle projects they name all exist
  # (scripts/check-docs.py, #274). A few seconds, and it runs on every change, docs-only
  # ones included: a renamed file or heading fails here instead of leaving a doc stale.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the docs
        run: python3 scripts/check-docs.py

      # The Spanish phrasebook is made from presets/*.zip (#342): a preset that changed without it fails here.
      - name: Check the Spanish phrasebook is current
        run: python3 scripts/build-phrasebook.py --check

  # The required check. It passes when the docs check passed and the three build jobs did
  # too, or were skipped because only docs changed; it runs even then (always()), so the
  # check always reports (#183).
  build-and-test:
    needs: [changes, docs, android, web, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The docs check passed, and all three build jobs did, or only docs changed
        run: |
          echo "changes: ${{ needs.changes.result }}, code: ${{ needs.changes.outputs.code }}, docs: ${{ needs.docs.result }}"
          echo "android: ${{ needs.android.result }}, web: ${{ needs.web.result }}, coverage: ${{ needs.coverage.result }}"
          if [ "${{ needs.changes.result }}" != "success" ] || [ "${{ needs.docs.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then exit 0; fi
          [ "${{ needs.android.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ] && [ "${{ needs.coverage.result }}" = "success" ]

  # A scheduled run that fails or is cancelled tells nobody otherwise: it opens an issue, or
  # comments on the one already open (#364). It only ever runs for the schedule, and it's the
  # only job here that may write issues.
  report-scheduled-failure:
    needs: build-and-test
    if: always() && github.event_name == 'schedule' && needs.build-and-test.result != 'success'
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure-issue.yml
    with:
      workflow-name: CI
