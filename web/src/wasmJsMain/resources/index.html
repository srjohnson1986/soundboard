<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A communication board: tap a tile to hear its words spoken aloud.">
    <title>Soundboard</title>
    <meta name="theme-color" content="#5e35b1">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1b1f; }
        #loading {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: 16px; text-align: center; color: #e6e1e5;
            font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    <script>
        // Kotlin/Wasm needs WebAssembly garbage collection: current Chrome, Edge, Firefox,
        // and Safari 18.2 or later. Say so instead of leaving a blank page.
        window.addEventListener('DOMContentLoaded', () => {
            let supported = false;
            try {
                supported = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
            } catch (e) {}
            if (!supported) {
                document.getElementById('loading').textContent =
                    'Soundboard needs a newer browser: a current Chrome, Edge or Firefox, or Safari 18.2 or later.';
            }
        });
    </script>
    <script>
        // Offline support and "install" (sw.js). Not on the local dev server, whose builds
        // change constantly.
        if ('serviceWorker' in navigator && location.port !== '8080') {
            // Hands the worker every file the page loads before the worker controls it, for it to
            // keep (#281). A file is only listed once it has finished, so a snapshot taken when
            // the worker is ready or takes over misses one still on its way: it began before the
            // worker could see it and ends after the snapshot, which left a slow first visit
            // without its wasm offline (#307). So this watches instead: every file already
            // finished, and each one that finishes later. Files the worker itself answered
            // (workerStart is set) it has kept already.
            const keepLoaded = registration => {
                const send = urls => urls.length > 0 && registration.active && registration.active.postMessage({ keep: urls });
                send([location.href]);
                try {
                    new PerformanceObserver(list => send(
                        list.getEntries().filter(entry => entry.workerStart === 0).map(entry => entry.name)
                    )).observe({ type: 'resource', buffered: true });
                } catch (e) {
                    send(performance.getEntriesByType('resource').map(entry => entry.name));
                }
            };
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
                navigator.serviceWorker.ready.then(keepLoaded);
            });
        }
    </script>
    <script type="application/javascript" src="soundboard.js"></script>
</head>
<body>
    <div id="loading">Loading Soundboard…</div>
</body>
</html>
