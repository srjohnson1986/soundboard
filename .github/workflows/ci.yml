name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Documentation-only changes skip the build: nothing in a Markdown file can break it.
  # This is a job-level skip rather than a workflow-level paths-ignore on purpose:
  # build-and-test is a required check on master, and a workflow that never runs never
  # reports its check, leaving the PR stuck on "pending". A job skipped by `if:` still
  # reports ("skipped"), which counts as passing (#183).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything besides docs change?
        id: filter
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push) range="${{ github.event.before }}..${{ github.sha }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;  # manual runs always build
          esac
          changed="$(git diff --name-only "$range")"
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # The shared module's tests, on the JVM and compiled to WebAssembly: this is what
      # keeps shared code building for the web version as well as Android (#193).
      - name: Shared module tests (JVM + Wasm)
        run: ./gradlew :shared:allTests --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload shared test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-report
          path: shared/build/reports/tests/allTests
          if-no-files-found: ignore
